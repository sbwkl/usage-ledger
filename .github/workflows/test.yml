name: test

on:
  pull_request:
  push:
    branches: [main, sit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Fast suite with branch coverage
        shell: bash
        run: |
          set -o pipefail
          python -m coverage run --branch --source=src/usage_ledger -m unittest discover -s tests -t . 2>&1 | tee test.log
      - name: Export coverage JSON
        run: python -m coverage json -o coverage.json
      - name: Coverage policy
        run: python scripts/check_coverage.py coverage.json
      - name: Upload coverage and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: |
            coverage.json
            test.log
          if-no-files-found: ignore

  policy:
    name: test policy
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Skip and time policy
        run: python scripts/check_test_policy.py
      - name: AC mapping
        run: python scripts/check_ac_map.py
