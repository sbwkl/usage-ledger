name: test

on:
  pull_request:
  push:
    branches: [main, sit]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Fast suite with branch coverage
        run: python -m coverage run --branch --source=src/usage_ledger -m unittest discover -s tests -t .
      - name: Export coverage JSON
        run: python -m coverage json -o coverage.json
      - name: Coverage policy
        run: python scripts/check_coverage.py coverage.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.json
          if-no-files-found: ignore

  policy:
    name: test policy
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Skip and time policy
        run: python scripts/check_test_policy.py
      - name: AC mapping
        run: python scripts/check_ac_map.py
